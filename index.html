<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カンバンボード</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js"></script>
</head>
<body class="bg-gray-900">
    <div id="app"></div>
    
    <script>
        // ========== Part 1: 設定と状態管理 ==========
        const CONFIG = {
            CLIENT_ID: '417822818519-8imosvo7c9e2gem7cp0rse0vm8vrjlou.apps.googleusercontent.com',
            SCOPES: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/spreadsheets',
            PARENT_FOLDER_NAME: '10_WSB-APP',
            TODO_FOLDER_NAME: 'ToDoリスト',
            JSON_FILE_NAME: 'kanban_data.json',
            SPREADSHEET_ID: '1YPV5vgH4YqluO4929Pwl3QOoLrkWX0gsSLMS7osEY5E',
            LOCAL_STORAGE_KEY: 'kanban_data_cache_v1',
            SAVE_DEBOUNCE_MS: 1500,
            APP_VERSION: '260518-1200'
        };

        let gapiInited = false;
        let gisInited = false;
        let tokenClient;
        let accessToken = null;
        let fileId = null;
        let saveTimerId = null;
        let pendingDirty = false;

        let state = {
            groups: [
                { id: 'group1', title: 'Todo', color: 'bg-gray-700', row: 0, items: [
                    { id: '1', content: '新しいプロジェクトの企画書を作成', completed: false, memo: '' }
                ]},
                { id: 'group2', title: '進行中', color: 'bg-green-800', row: 0, items: [] },
                { id: 'group3', title: '完了', color: 'bg-purple-800', row: 0, items: [] }
            ],
            draggedItem: null,
            draggedFrom: null,
            draggedGroup: null,
            newTaskGroup: null,
            newTaskContent: '',
            newGroupName: '',
            isAddingGroup: false,
            editingGroupId: null,
            editingGroupName: '',
            selectedTaskId: null,
            selectedTaskGroupId: null,
            isSignedIn: false,
            isSaving: false,
            folderId: null,
            lastUpdated: null,
            lastSyncedUpdated: null,
            isDriveLoading: false
        };

        // ========== localStorage キャッシュ ==========
        function saveToLocalCache() {
            try {
                localStorage.setItem(CONFIG.LOCAL_STORAGE_KEY, JSON.stringify({
                    groups: state.groups,
                    lastUpdated: state.lastUpdated
                }));
            } catch (e) {
                console.error('localStorage 保存失敗:', e);
            }
        }

        function loadFromLocalCache() {
            try {
                const raw = localStorage.getItem(CONFIG.LOCAL_STORAGE_KEY);
                if (!raw) return false;
                const data = JSON.parse(raw);
                if (data.groups) {
                    state.groups = data.groups;
                    state.lastUpdated = data.lastUpdated || null;
                    return true;
                }
            } catch (e) {
                console.error('localStorage 読み込み失敗:', e);
            }
            return false;
        }

        // ========== 保存スケジューリング (debounce) ==========
        function persistState() {
            state.lastUpdated = new Date().toISOString();
            saveToLocalCache();
            scheduleSave();
        }

        function scheduleSave() {
            if (!state.isSignedIn) {
                pendingDirty = true;
                return;
            }
            pendingDirty = true;
            if (saveTimerId) clearTimeout(saveTimerId);
            saveTimerId = setTimeout(() => {
                saveTimerId = null;
                if (state.isSaving) {
                    // 進行中の保存がある場合は少し待って再試行
                    scheduleSave();
                    return;
                }
                saveToDrive();
            }, CONFIG.SAVE_DEBOUNCE_MS);
        }

        // ページ離脱前に保存中の変更があれば flush
        window.addEventListener('beforeunload', (e) => {
            if (pendingDirty && state.isSignedIn) {
                // sendBeacon で同期保存（best effort）
                try {
                    if (saveTimerId) clearTimeout(saveTimerId);
                    saveToDrive();
                } catch (_) {}
            }
        });

        // ========== Google API初期化 ==========
        function gapiLoaded() {
            gapi.load('client', async () => {
                await gapi.client.init({
                    discoveryDocs: [
                        'https://www.googleapis.com/discovery/v1/apis/drive/v3/rest',
                        'https://sheets.googleapis.com/$discovery/rest?version=v4'
                    ]
                });
                gapiInited = true;
                maybeEnableButtons();
            });
        }

        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CONFIG.CLIENT_ID,
                scope: CONFIG.SCOPES,
                callback: ''
            });
            gisInited = true;
            maybeEnableButtons();
        }

        function maybeEnableButtons() {
            if (gapiInited && gisInited) tryAutoSignIn();
        }

        // ========== 認証関連 ==========
        function handleAuthClick() {
            tokenClient.callback = async (resp) => {
                if (resp.error !== undefined) throw (resp);
                accessToken = gapi.client.getToken().access_token;
                state.isSignedIn = true;
                localStorage.setItem('google_access_token', JSON.stringify(gapi.client.getToken()));
                render();
                // Drive 読み込みはバックグラウンド
                loadFromDrive({ silent: false });
            };
            if (gapi.client.getToken() === null) {
                tokenClient.requestAccessToken({prompt: 'consent'});
            } else {
                tokenClient.requestAccessToken({prompt: ''});
            }
        }

        async function tryAutoSignIn() {
            const savedToken = localStorage.getItem('google_access_token');
            if (!savedToken) {
                render();
                return;
            }
            try {
                const token = JSON.parse(savedToken);
                gapi.client.setToken(token);
                accessToken = token.access_token;
                state.isSignedIn = true;
                render();
                // Drive 読み込みはバックグラウンドで実行（UI を待たせない）
                loadFromDrive();
            } catch (error) {
                localStorage.removeItem('google_access_token');
                render();
            }
        }

        function handleSignOut() {
            gapi.client.setToken(null);
            localStorage.removeItem('google_access_token');
            accessToken = null;
            state.isSignedIn = false;
            state.folderId = null;
            fileId = null;
            render();
            showMessage('ログアウトしました', 'success');
        }

        function showMessage(message, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `fixed top-4 right-4 px-6 py-3 rounded-lg shadow-lg text-white z-50 ${type === 'success' ? 'bg-green-500' : 'bg-red-500'}`;
            messageDiv.textContent = message;
            document.body.appendChild(messageDiv);
            setTimeout(() => messageDiv.remove(), 3000);
        }

        function formatDateTime(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            return `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getDate()).padStart(2, '0')} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        }

        window.addEventListener('load', () => {
            // 1. まず localStorage から即描画（Drive を待たない）
            loadFromLocalCache();
            render();
            // 2. Google API を裏で初期化
            gapiLoaded();
            gisLoaded();
        });

        // Google Drive接続（バックグラウンド読み込み）
        async function loadFromDrive(options = {}) {
            const { silent = true, force = false } = options;
            if (state.isDriveLoading) return;
            state.isDriveLoading = true;
            render();
            try {
                let parentFolderId = await findOrCreateFolder(CONFIG.PARENT_FOLDER_NAME, 'root');
                let todoFolderId = await findOrCreateFolder(CONFIG.TODO_FOLDER_NAME, parentFolderId);
                state.folderId = todoFolderId;
                await loadJsonData({ force });
                if (!silent) showMessage('Google Driveから取得しました', 'success');
            } catch (error) {
                const msg = error.result?.error?.message || error.message;
                // 401/403 は認証切れとして扱う
                if (error.status === 401 || error.result?.error?.code === 401) {
                    showMessage('認証の有効期限が切れました。再ログインしてください。', 'error');
                    handleSignOut();
                } else {
                    showMessage('Drive 取得エラー: ' + msg, 'error');
                }
            } finally {
                state.isDriveLoading = false;
                render();
            }
        }

        // 手動再取得（ヘッダーボタンから呼ぶ）
        async function manualRefresh() {
            if (!state.isSignedIn) {
                showMessage('先にGoogle Driveに接続してください', 'error');
                return;
            }
            await loadFromDrive({ silent: false, force: true });
        }
        
        // フォルダ検索または作成
        async function findOrCreateFolder(folderName, parentId) {
            const response = await gapi.client.drive.files.list({
                q: `name='${folderName}' and mimeType='application/vnd.google-apps.folder' and '${parentId}' in parents and trashed=false`,
                fields: 'files(id, name)',
                spaces: 'drive'
            });
            if (response.result.files && response.result.files.length > 0) {
                return response.result.files[0].id;
            }
            const createResponse = await gapi.client.drive.files.create({
                resource: {
                    name: folderName,
                    mimeType: 'application/vnd.google-apps.folder',
                    parents: [parentId]
                },
                fields: 'id'
            });
            return createResponse.result.id;
        }
        
        // JSONデータ読み込み (lastUpdated 比較でローカル/リモートの新しい方を採用)
        async function loadJsonData(options = {}) {
            const { force = false } = options;
            if (!state.folderId) return;
            try {
                const response = await gapi.client.drive.files.list({
                    q: `name='${CONFIG.JSON_FILE_NAME}' and '${state.folderId}' in parents and trashed=false`,
                    fields: 'files(id, name)',
                    spaces: 'drive'
                });
                const files = response.result.files;
                if (files && files.length > 0) {
                    fileId = files[0].id;
                    const fileContent = await gapi.client.drive.files.get({
                        fileId: fileId,
                        alt: 'media'
                    });
                    if (fileContent.body) {
                        const data = JSON.parse(fileContent.body);
                        const remoteUpdated = data.lastUpdated || null;
                        const localUpdated = state.lastUpdated || null;

                        // 強制取得、ローカルが空、リモートが新しい場合は採用
                        const remoteIsNewer = remoteUpdated && (!localUpdated || remoteUpdated > localUpdated);
                        if (force || !localUpdated || remoteIsNewer) {
                            state.groups = data.groups || state.groups;
                            state.lastUpdated = remoteUpdated;
                            state.lastSyncedUpdated = remoteUpdated;
                            saveToLocalCache();
                        } else if (pendingDirty && remoteUpdated) {
                            // ローカルに未同期の変更があり、かつリモートにも内容がある
                            // → ユーザーに確認（オフライン編集中に他デバイスが更新した可能性）
                            const ok = confirm(
                                'ローカルに未同期の変更があります。\n' +
                                `ローカル: ${formatDateTime(localUpdated)}\n` +
                                `リモート: ${formatDateTime(remoteUpdated)}\n\n` +
                                'OK = ローカル変更を保持してリモートに反映\n' +
                                'キャンセル = リモートを取得（ローカル変更は破棄）'
                            );
                            if (ok) {
                                state.lastSyncedUpdated = remoteUpdated;
                                scheduleSave();
                            } else {
                                state.groups = data.groups || state.groups;
                                state.lastUpdated = remoteUpdated;
                                state.lastSyncedUpdated = remoteUpdated;
                                pendingDirty = false;
                                saveToLocalCache();
                            }
                        } else {
                            // ローカルが新しいが未同期変更なし → 同期済とみなす
                            state.lastSyncedUpdated = remoteUpdated;
                        }
                    }
                } else {
                    fileId = null;
                    state.lastSyncedUpdated = null;
                    // リモートにファイルが無い場合、ローカルに変更があれば保存
                    if (state.lastUpdated) scheduleSave();
                }
            } catch (error) {
                console.error('loadJsonData エラー:', error);
                fileId = null;
            }
        }
        
        // Google Driveに保存（debounce で呼び出される）
        async function saveToDrive() {
            if (!state.isSignedIn || !state.folderId || state.isSaving) return;
            if (!pendingDirty) return;

            state.isSaving = true;
            render();
            try {
                // --- 競合チェック: Drive 側の lastUpdated が自分の lastSyncedUpdated より新しいか確認 ---
                if (fileId) {
                    try {
                        const remoteCheck = await gapi.client.drive.files.get({
                            fileId: fileId,
                            alt: 'media'
                        });
                        if (remoteCheck.body) {
                            const remoteData = JSON.parse(remoteCheck.body);
                            const remoteUpdated = remoteData.lastUpdated || null;
                            const isConflict = remoteUpdated
                                && state.lastSyncedUpdated
                                && remoteUpdated > state.lastSyncedUpdated;
                            if (isConflict) {
                                const ok = confirm(
                                    '他のデバイスで更新されています。\n' +
                                    `リモート更新: ${formatDateTime(remoteUpdated)}\n` +
                                    `ローカル更新: ${formatDateTime(state.lastUpdated)}\n\n` +
                                    'OK = ローカルを優先して上書き保存\n' +
                                    'キャンセル = リモートを取得（ローカル変更は破棄）'
                                );
                                if (!ok) {
                                    // リモート優先で再読み込み
                                    state.groups = remoteData.groups || state.groups;
                                    state.lastUpdated = remoteUpdated;
                                    state.lastSyncedUpdated = remoteUpdated;
                                    saveToLocalCache();
                                    pendingDirty = false;
                                    showMessage('リモートの内容を取得しました', 'success');
                                    return;
                                }
                            }
                        }
                    } catch (e) {
                        // 競合チェック失敗時は通常保存にフォールバック
                        console.warn('競合チェック失敗（保存は継続）:', e);
                    }
                }

                const now = state.lastUpdated || new Date().toISOString();
                const content = JSON.stringify({ groups: state.groups, lastUpdated: now });
                const file = new Blob([content], { type: 'application/json' });
                const metadata = {
                    name: CONFIG.JSON_FILE_NAME,
                    mimeType: 'application/json',
                    ...(fileId ? {} : { parents: [state.folderId] })
                };
                const form = new FormData();
                form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                form.append('file', file);
                const url = fileId
                    ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`
                    : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
                const response = await fetch(url, {
                    method: fileId ? 'PATCH' : 'POST',
                    headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
                    body: form
                });
                if (response.status === 401) {
                    showMessage('認証の有効期限が切れました。再ログインしてください。', 'error');
                    handleSignOut();
                    return;
                }
                if (!response.ok) throw new Error(`保存に失敗: ${response.status}`);
                const result = await response.json();
                if (!fileId) fileId = result.id;
                state.lastUpdated = now;
                state.lastSyncedUpdated = now;
                pendingDirty = false;
                saveToLocalCache();
            } catch (error) {
                showMessage('保存に失敗: ' + error.message, 'error');
            } finally {
                state.isSaving = false;
                render();
            }
        }
        
        // スプレッドシート同期
        async function exportToSpreadsheet() {
            if (!state.isSignedIn) {
                showMessage('先にGoogle Driveに接続してください', 'error');
                return;
            }
            try {
                showMessage('スプレッドシートに書き込み中...', 'success');
                const headers = [['グループ名', '行', 'タスク内容', '完了状態', '最終更新日時']];
                const rows = [];
                state.groups.forEach(group => {
                    group.items.forEach(item => {
                        rows.push([
                            group.title,
                            `${group.row + 1}行目`,
                            item.content,
                            item.completed ? '✓' : '',
                            new Date().toLocaleString('ja-JP')
                        ]);
                    });
                });
                await gapi.client.sheets.spreadsheets.values.clear({
                    spreadsheetId: CONFIG.SPREADSHEET_ID,
                    range: 'シート1!A1:Z'
                });
                await gapi.client.sheets.spreadsheets.values.update({
                    spreadsheetId: CONFIG.SPREADSHEET_ID,
                    range: 'シート1!A1',
                    valueInputOption: 'RAW',
                    resource: { values: [...headers, ...rows] }
                });
                await gapi.client.sheets.spreadsheets.batchUpdate({
                    spreadsheetId: CONFIG.SPREADSHEET_ID,
                    resource: {
                        requests: [{
                            repeatCell: {
                                range: { sheetId: 0, startRowIndex: 0, endRowIndex: 1 },
                                cell: { userEnteredFormat: { textFormat: { bold: true }}},
                                fields: 'userEnteredFormat.textFormat.bold'
                            }
                        }]
                    }
                });
                window.open(`https://docs.google.com/spreadsheets/d/${CONFIG.SPREADSHEET_ID}`, '_blank');
                showMessage('スプレッドシートに書き込みました！', 'success');
            } catch (error) {
                showMessage('スプレッドシート書き込み失敗: ' + (error.result?.error?.message || error.message), 'error');
            }
        }

        // ドラッグ&ドロップ: タスク開始
        function handleTaskDragStart(e, item, groupId) {
            state.draggedItem = item;
            state.draggedFrom = groupId;
            e.dataTransfer.effectAllowed = 'move';
            e.stopPropagation();
        }
        
        // ドラッグ&ドロップ: グループ開始
        function handleGroupDragStart(e, groupId) {
            state.draggedGroup = groupId;
            e.dataTransfer.effectAllowed = 'move';
        }
        
        // ドラッグオーバー
        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }
        
        // ドロップ: タスク
        async function handleTaskDrop(e, targetGroupId, targetIndex = null) {
            e.preventDefault();
            e.stopPropagation();
            if (!state.draggedItem || !state.draggedFrom) return;
            
            // 元のグループから削除
            state.groups = state.groups.map(group => {
                if (group.id === state.draggedFrom) {
                    return { ...group, items: group.items.filter(item => item.id !== state.draggedItem.id) };
                }
                return group;
            });
            
            // ターゲットグループに追加
            state.groups = state.groups.map(group => {
                if (group.id === targetGroupId) {
                    const newItems = [...group.items];
                    if (targetIndex !== null && targetIndex >= 0) {
                        // 特定の位置に挿入
                        newItems.splice(targetIndex, 0, state.draggedItem);
                    } else {
                        // 末尾に追加
                        newItems.push(state.draggedItem);
                    }
                    return { ...group, items: newItems };
                }
                return group;
            });
            
            state.draggedItem = null;
            state.draggedFrom = null;
            persistState();
            render();
        }

        // ドロップ: グループ
        function handleGroupDrop(e, targetRow, targetIndex) {
            e.preventDefault();
            if (!state.draggedGroup) return;
            const draggedGroupData = state.groups.find(g => g.id === state.draggedGroup);
            const otherGroups = state.groups.filter(g => g.id !== state.draggedGroup);
            const targetRowGroups = otherGroups.filter(g => g.row === targetRow);
            targetRowGroups.splice(targetIndex, 0, { ...draggedGroupData, row: targetRow });
            const otherRowGroups = otherGroups.filter(g => g.row !== targetRow);
            state.groups = [...otherRowGroups, ...targetRowGroups];
            state.draggedGroup = null;
            persistState();
            render();
        }
        
        // タスク追加
        function addTask(groupId) {
            if (!state.newTaskContent.trim()) return;
            const newTask = {
                id: Date.now().toString(),
                content: state.newTaskContent,
                completed: false,
                memo: ''
            };
            state.groups = state.groups.map(group =>
                group.id === groupId ? { ...group, items: [...group.items, newTask] } : group
            );
            state.newTaskContent = '';
            state.newTaskGroup = null;
            persistState();
            render();
        }

        // グループ追加
        function addGroup() {
            if (!state.newGroupName.trim()) return;
            const colors = ['bg-blue-800', 'bg-red-800', 'bg-indigo-800', 'bg-pink-800', 'bg-teal-800'];
            const newGroup = {
                id: Date.now().toString(),
                title: state.newGroupName,
                color: colors[Math.floor(Math.random() * colors.length)],
                row: 0,
                items: []
            };
            state.groups = [...state.groups, newGroup];
            state.newGroupName = '';
            state.isAddingGroup = false;
            persistState();
            render();
        }

        // タスク削除(完全削除)
        function deleteTask(groupId, taskId) {
            if (!confirm('このタスクを削除しますか？')) return;

            state.groups = state.groups.map(group => {
                if (group.id === groupId) {
                    return { ...group, items: group.items.filter(item => item.id !== taskId) };
                }
                return group;
            });
            persistState();
            render();
        }
        
        // タスク完了トグル
        function toggleComplete(groupId, taskId) {
            const item = state.groups.find(g => g.id === groupId)?.items.find(i => i.id === taskId);
            if (!item) return;
            
            // 完了状態をトグル
            const updatedItem = { ...item, completed: !item.completed };
            
            // 完了する場合は元のグループIDを保存
            if (updatedItem.completed && !updatedItem.originalGroupId) {
                updatedItem.originalGroupId = groupId;
            }
            
            // 元のグループから削除
            state.groups = state.groups.map(group => {
                if (group.id === groupId) {
                    return { ...group, items: group.items.filter(i => i.id !== taskId) };
                }
                return group;
            });
            
            // 完了状態に応じて適切なグループに追加
            let targetGroupId;
            if (updatedItem.completed) {
                targetGroupId = 'group3'; // 完了グループへ
            } else {
                targetGroupId = updatedItem.originalGroupId || 'group1'; // 元のグループまたはTodoへ
                delete updatedItem.originalGroupId; // 完了解除時は元グループIDを削除
            }
            
            state.groups = state.groups.map(group => {
                if (group.id === targetGroupId) {
                    return { ...group, items: [...group.items, updatedItem] };
                }
                return group;
            });

            persistState();
            render();
        }

        // グループ削除
        function deleteGroup(groupId) {
            if (confirm('このグループを削除しますか？\n中のタスクもすべて削除されます。')) {
                state.groups = state.groups.filter(group => group.id !== groupId);
                persistState();
                render();
            }
        }
        
        // グループ名編集開始
        function startEditGroupName(groupId) {
            const group = state.groups.find(g => g.id === groupId);
            if (group) {
                state.editingGroupId = groupId;
                state.editingGroupName = group.title;
                render();
                setTimeout(() => {
                    const input = document.getElementById(`group-name-input-${groupId}`);
                    if (input) { 
                        input.focus(); 
                        input.select(); 
                    }
                }, 0);
            }
        }
        
        // グループ名保存
        function saveGroupName(groupId) {
            if (!state.editingGroupName.trim()) {
                cancelEditGroupName();
                return;
            }
            state.groups = state.groups.map(group =>
                group.id === groupId ? { ...group, title: state.editingGroupName } : group
            );
            state.editingGroupId = null;
            state.editingGroupName = '';
            persistState();
            render();
        }
        
        // グループ名編集キャンセル
        function cancelEditGroupName() {
            state.editingGroupId = null;
            state.editingGroupName = '';
            render();
        }

        // タスク選択
        function selectTask(groupId, taskId) {
            state.selectedTaskId = taskId;
            state.selectedTaskGroupId = groupId;
            render();
            setTimeout(() => {
                const input = document.getElementById('selected-task-name-input');
                if (input) {
                    input.focus();
                    input.select();
                }
            }, 0);
        }
        
        // タスク選択解除
        function deselectTask() {
            saveTaskChanges();
            state.selectedTaskId = null;
            state.selectedTaskGroupId = null;
            render();
        }
              
        // タスク編集キャンセル
        function cancelEditTask() {
            state.editingTaskId = null;
            state.editingTaskGroupId = null;
            render();
        }

        // タスク編集用の保存管理
        let isTaskNameComposing = false;
        let hasUnsavedChanges = false;

        function saveTaskChanges() {
            if (state.isSaving || !hasUnsavedChanges) return;
            
            // 入力フィールドから値を取得
            const nameInput = document.getElementById('selected-task-name-input');
            const memoTextarea = document.getElementById('task-memo-textarea');
            
            if (nameInput && state.selectedTaskId && state.selectedTaskGroupId) {
                state.groups = state.groups.map(group =>
                    group.id === state.selectedTaskGroupId
                        ? {
                            ...group,
                            items: group.items.map(item =>
                                item.id === state.selectedTaskId 
                                    ? { 
                                        ...item, 
                                        content: nameInput.value,
                                        memo: memoTextarea ? memoTextarea.value : item.memo
                                    } 
                                    : item
                            )
                        }
                        : group
                );
                
                hasUnsavedChanges = false;

                // 左側のタスク表示だけを更新(タスク編集パネルは再描画しない)
                updateTaskDisplay();

                persistState();
            }
        }
        
        function updateTaskDisplay() {
            // 左側のグループ内のタスク表示のみを更新
            state.groups.forEach(group => {
                group.items.forEach(item => {
                    const taskElements = document.querySelectorAll(`[onclick*="selectTask('${group.id}', '${item.id}')"]`);
                    taskElements.forEach(el => {
                        const contentP = el.querySelector('p');
                        if (contentP) {
                            contentP.textContent = item.content;
                        }
                    });
                });
            });
        }

        function handleTaskNameInput(event, groupId, taskId, input) {
            if ((event && event.isComposing) || isTaskNameComposing) {
                return;
            }
            hasUnsavedChanges = true;
        }

        function handleTaskNameCompositionStart() {
            isTaskNameComposing = true;
        }

        function handleTaskNameCompositionEnd(groupId, taskId, input) {
            isTaskNameComposing = false;
            hasUnsavedChanges = true;
        }
        
        function handleMemoInput(groupId, taskId, textarea) {
            adjustMemoTextareaHeight(textarea);
            hasUnsavedChanges = true;
        }
        
        function adjustMemoTextareaHeight(textarea) {
            if (!textarea) return;
            textarea.style.height = 'auto';
            const scrollHeight = textarea.scrollHeight;
            const maxHeight = window.innerHeight - 250; // 一番下まで広げる
            textarea.style.height = Math.min(scrollHeight, maxHeight) + 'px';
            textarea.style.overflowY = scrollHeight > maxHeight ? 'auto' : 'hidden';
        }

        function render() {
            const row0Groups = state.groups.filter(g => g.row === 0);
            const row1Groups = state.groups.filter(g => g.row === 1);
        
            const renderGroup = (group, index, row) => {
                const isEditing = state.editingGroupId === group.id;
                return `
                    <div class="flex-shrink-0 w-80 relative" draggable="true" 
                         onDragStart="handleGroupDragStart(event, '${group.id}')" 
                         onDragOver="handleDragOver(event)"
                         onDrop="handleGroupDrop(event, ${row}, ${index})">
                        <div class="absolute inset-y-0 left-0 w-2 z-10 pointer-events-auto" 
                             onDragOver="handleDragOver(event)"
                             onDrop="handleGroupDrop(event, ${row}, ${index})"></div>
                        <div class="absolute inset-y-0 right-0 w-2 z-10 pointer-events-auto" 
                             onDragOver="handleDragOver(event)"
                             onDrop="handleGroupDrop(event, ${row}, ${index + 1})"></div>
                        <div class="${group.color} rounded-t-lg p-3 cursor-move">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2 flex-1">
                                    <svg class="w-4 h-4 text-white opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"></path></svg>
                                    ${isEditing ? `
                                        <input id="group-name-input-${group.id}" type="text" value="${state.editingGroupName}" 
                                               oninput="state.editingGroupName = this.value" 
                                               onkeypress="if(event.key==='Enter') { saveGroupName('${group.id}'); event.target.blur(); }"
                                               onblur="if(state.editingGroupId === '${group.id}') saveGroupName('${group.id}')" 
                                               class="flex-1 px-2 py-1 bg-white text-gray-800 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
                                    ` : `
                                        <h2 class="text-white font-semibold cursor-pointer hover:underline" onclick="startEditGroupName('${group.id}')">
                                            ${group.title} <span class="ml-2 text-sm opacity-80">(${group.items.length})</span>
                                        </h2>
                                    `}
                                </div>
                                <div class="flex gap-1">
                                    ${isEditing ? `
                                        <button onclick="saveGroupName('${group.id}')" class="p-1 hover:bg-white hover:bg-opacity-20 rounded transition-colors">
                                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                                        </button>
                                        <button onclick="cancelEditGroupName()" class="p-1 hover:bg-white hover:bg-opacity-20 rounded transition-colors">
                                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                        </button>
                                    ` : `
                                        <button onclick="state.newTaskGroup = '${group.id}'; render();" class="p-1 hover:bg-white hover:bg-opacity-20 rounded transition-colors">
                                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                                        </button>
                                        <button onclick="deleteGroup('${group.id}')" class="p-1 hover:bg-white hover:bg-opacity-20 rounded transition-colors">
                                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                        </button>
                                    `}
                                </div>
                            </div>
                        </div>
                        <div class="bg-gray-800 rounded-b-lg p-3 min-h-[200px] max-h-[calc(100vh-300px)] overflow-y-auto" onDragOver="handleDragOver(event)" onDrop="handleTaskDrop(event, '${group.id}')">
                            ${state.newTaskGroup === group.id ? `
                                <div class="mb-3">
                                    <input id="new-task-input-${group.id}" type="text" value="${state.newTaskContent}" 
                                           oninput="state.newTaskContent = this.value" 
                                           onkeypress="if(event.key==='Enter' && state.newTaskContent.trim()) addTask('${group.id}')"
                                           onblur="if(state.newTaskContent.trim()) { addTask('${group.id}'); } else { state.newTaskGroup = null; state.newTaskContent = ''; render(); }"
                                           placeholder="アイテムを追加する" 
                                           class="w-full px-3 py-2 bg-gray-700 text-white text-sm border border-gray-600 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"/>
                                </div>
                            ` : ''}
                            
                            <div class="space-y-2">
                                ${group.items.map((item, itemIndex) => {
                                    const isSelected = state.selectedTaskId === item.id && state.selectedTaskGroupId === group.id;
                                    return `
                                    <div draggable="true" 
                                         onDragStart="handleTaskDragStart(event, ${JSON.stringify(item).replace(/"/g, '&quot;')}, '${group.id}')" 
                                         onDragOver="handleDragOver(event)"
                                         onDrop="handleTaskDrop(event, '${group.id}', ${itemIndex})"
                                         onclick="selectTask('${group.id}', '${item.id}')"
                                         class="bg-gray-700 rounded p-3 cursor-pointer hover:bg-gray-650 transition-colors group ${isSelected ? 'ring-2 ring-blue-500' : ''}">
                                        <div class="flex items-start gap-2">
                                            <button onclick="event.stopPropagation(); toggleComplete('${group.id}', '${item.id}')" 
                                                    class="flex-shrink-0 w-5 h-5 rounded border-2 mt-0.5 flex items-center justify-center transition-colors ${item.completed ? 'bg-green-500 border-green-500' : 'border-gray-500 hover:border-gray-400'}">
                                                ${item.completed ? '<svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>' : ''}
                                            </button>
                                            <div class="flex-1">
                                                <p class="text-white text-sm ${item.completed ? 'line-through opacity-60' : ''}">${item.content}</p>
                                            </div>
                                            <button onclick="event.stopPropagation(); deleteTask('${group.id}', '${item.id}')" 
                                                    class="opacity-0 group-hover:opacity-100 transition-opacity p-1 hover:bg-gray-600 rounded flex-shrink-0">
                                                <svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                            </button>
                                        </div>
                                    </div>
                                `}).join('')}
                            </div>
                            
                            ${state.newTaskGroup !== group.id ? `
                                <button onclick="state.newTaskGroup = '${group.id}'; render();" 
                                        class="w-full mt-2 p-2 text-left text-gray-400 hover:text-white hover:bg-gray-700 rounded transition-colors text-sm">
                                    + アイテムを追加する
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            };
        
            // メインレイアウト
            const selectedTask = state.selectedTaskId && state.selectedTaskGroupId 
                ? state.groups.find(g => g.id === state.selectedTaskGroupId)?.items.find(i => i.id === state.selectedTaskId)
                : null;
            
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen p-4" onclick="if(state.selectedTaskId) saveTaskChanges();">
                    <div class="space-y-4">
                        <!-- 1行目 -->
                        <div class="flex gap-4 overflow-x-auto pb-4 ${selectedTask ? 'pr-[25rem]' : ''}">
                            ${row0Groups.map((group, index) => renderGroup(group, index, 0)).join('')}
                        </div>
                        
                        <!-- 2行目 -->
                        <div class="flex gap-4 overflow-x-auto pb-4">
                            ${row1Groups.map((group, index) => renderGroup(group, index, 1)).join('')}
                            
                            ${state.isAddingGroup ? `
                                <div class="flex-shrink-0 w-80 bg-gray-800 rounded-lg p-3">
                                    <input type="text" 
                                           value="${state.newGroupName}" 
                                           onchange="state.newGroupName = this.value" 
                                           onkeypress="if(event.key==='Enter') addGroup()" 
                                           placeholder="グループ名を入力" 
                                           class="w-full px-3 py-2 bg-gray-700 text-white border-none rounded focus:outline-none focus:ring-2 focus:ring-blue-500 mb-2" 
                                           autofocus/>
                                    <div class="flex gap-2">
                                        <button onclick="addGroup()" 
                                                class="px-3 py-1 bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors text-sm">
                                            追加
                                        </button>
                                        <button onclick="state.isAddingGroup = false; state.newGroupName = ''; render();" 
                                                class="px-3 py-1 bg-gray-600 text-white rounded hover:bg-gray-500 transition-colors text-sm">
                                            キャンセル
                                        </button>
                                    </div>
                                </div>
                            ` : `
                                <button onclick="state.isAddingGroup = true; render();" 
                                        class="flex-shrink-0 w-80 h-12 bg-gray-800 hover:bg-gray-750 rounded-lg flex items-center justify-center text-gray-400 hover:text-white transition-colors">
                                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                                    </svg>
                                    グループを追加
                                </button>
                            `}
                        </div>
                        
                    </div>
                    
                    ${selectedTask ? `
                    <!-- 右側編集パネル -->
                    <div class="fixed top-4 right-4 w-96 z-50" onclick="event.stopPropagation()">
                        <div class="bg-gray-800 rounded-lg p-4 border border-gray-700 shadow-2xl flex flex-col" style="max-height: calc(100vh - 150px);">
                            <div class="flex items-center justify-between mb-4">
                                <h3 class="text-white font-semibold">タスク編集</h3>
                                <button onclick="deselectTask()" class="text-gray-400 hover:text-white transition-colors">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                </button>
                            </div>
                            
                            <div class="flex flex-col gap-4 flex-1 overflow-hidden">
                                <div>
                                    <label class="block text-gray-400 text-xs mb-1">タスク名</label>
                                    <input id="selected-task-name-input" type="text" value="${selectedTask.content}"
                                           oninput="handleTaskNameInput(event, '${state.selectedTaskGroupId}', '${state.selectedTaskId}', this)"
                                           oncompositionstart="handleTaskNameCompositionStart()"
                                           oncompositionend="handleTaskNameCompositionEnd('${state.selectedTaskGroupId}', '${state.selectedTaskId}', this)"
                                           onkeydown="if(event.key==='Enter' && !event.isComposing) { event.preventDefault(); saveTaskChanges(); }"
                                           onblur="saveTaskChanges()"
                                           class="w-full px-3 py-2 bg-gray-700 text-white text-sm rounded focus:outline-none focus:ring-2 focus:ring-blue-500"/>
                                </div>
                                
                                <div class="flex flex-col flex-1 overflow-hidden">
                                    <label class="block text-gray-400 text-xs mb-1">メモ</label>
                                    <textarea id="task-memo-textarea"
                                           oninput="handleMemoInput('${state.selectedTaskGroupId}', '${state.selectedTaskId}', this)"
                                           onblur="saveTaskChanges()"
                                           onfocus="adjustMemoTextareaHeight(this)"
                                           placeholder="メモを入力..."
                                           style="min-height: 120px; max-height: calc(100vh - 250px);"
                                           class="w-full px-3 py-2 bg-gray-700 text-white text-sm rounded focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none overflow-y-auto">${selectedTask.memo || ''}</textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                    ` : ''}
                    
                    <!-- 右下固定パネル -->
                    <div class="fixed bottom-4 right-4 bg-gray-800 rounded-lg shadow-xl p-3 border border-gray-700">
                        <div class="flex flex-col gap-2">
                            ${state.isSignedIn ? `
                                <button onclick="manualRefresh()"
                                        ${state.isDriveLoading ? 'disabled' : ''}
                                        class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded-lg transition-colors text-xs whitespace-nowrap disabled:opacity-50">
                                    ${state.isDriveLoading ? '⏳ 取得中...' : '🔄 再取得'}
                                </button>
                                <button onclick="exportToSpreadsheet()"
                                        class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1.5 rounded-lg transition-colors text-xs whitespace-nowrap">
                                    📊 スプレッドシート同期
                                </button>
                                <div class="${state.isSaving ? 'bg-yellow-100 text-yellow-700' : (pendingDirty ? 'bg-orange-100 text-orange-700' : 'bg-green-100 text-green-700')} px-3 py-1 rounded-lg text-xs text-center">
                                    ${state.isSaving ? '💾 保存中...' : (pendingDirty ? '✏️ 未同期' : '✅ 同期済')}
                                </div>
                                <button onclick="handleSignOut()"
                                        class="bg-gray-600 hover:bg-gray-700 text-white px-3 py-1.5 rounded-lg text-xs transition-colors">
                                    ログアウト
                                </button>
                            ` : `
                                <button onclick="handleAuthClick()"
                                        class="bg-green-500 hover:bg-green-600 text-white px-3 py-2 rounded-lg font-semibold transition-colors shadow-lg text-xs whitespace-nowrap">
                                    🔗 Google Driveに接続
                                </button>
                                ${state.lastUpdated ? `
                                <div class="bg-gray-700 text-gray-300 px-3 py-1 rounded-lg text-xs text-center">
                                    📂 ローカル表示中
                                </div>
                                ` : ''}
                            `}
                            <div class="text-xs text-gray-400 text-center pt-2 border-t border-gray-700">
                                ${state.lastUpdated ? `更新: ${formatDateTime(state.lastUpdated)}<br>` : ''}
                                v${CONFIG.APP_VERSION}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // タスク入力欄に自動フォーカス
            if (state.newTaskGroup) {
                setTimeout(() => {
                    const input = document.getElementById(`new-task-input-${state.newTaskGroup}`);
                    if (input) {
                        input.focus();
                    }
                }, 0);
            }
            
            // メモ欄の高さを調整
            setTimeout(() => {
                const memoTextarea = document.getElementById('task-memo-textarea');
                if (memoTextarea) {
                    adjustMemoTextareaHeight(memoTextarea);
                }
            }, 0);
        }

    </script>

</body>
</html>
